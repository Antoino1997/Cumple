<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡Feliz cumpleaños, Alba!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--rosa:#ff5d9e;--rosa-osc:#c2255c;--lila:#8b5cf6;--sol:#ffd166;--tinta:#4a2342}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{min-height:100%}
body{font-family:Quicksand,system-ui,sans-serif;font-weight:500;color:var(--tinta);background:linear-gradient(160deg,#ffe3ef,#eadfff 55%,#d9f1ff) fixed;overflow-x:hidden}
:focus-visible{outline:3px solid var(--lila);outline-offset:3px}

/* Vistas (portada / secreto) */
.vista{display:none;min-height:100svh;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;padding:1.5rem 1rem 2.5rem;text-align:center;position:relative;z-index:2}
.vista.on{display:flex}
h1,h2{font-family:Pacifico,cursive;font-weight:400;color:var(--rosa-osc);line-height:1.15;text-shadow:0 3px 0 #fff}
h1{font-size:clamp(2.3rem,8.5vw,4.6rem);animation:cae .9s cubic-bezier(.2,1.3,.4,1) both}
h2{font-size:clamp(1.9rem,6vw,3rem)}
.sup{font-size:1.1rem;font-weight:700;color:var(--lila)}
#pista{max-width:30ch;min-height:2.8em;font-size:1.05rem}
.btn{font:700 1rem Quicksand,system-ui,sans-serif;padding:.7rem 1.4rem;border:0;border-radius:99px;background:var(--rosa);color:#fff;box-shadow:0 6px 0 var(--rosa-osc);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--rosa-osc)}
.btn.suave{background:#fff;color:var(--rosa-osc)}
.botones{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center}

/* Tarta */
#tarta{width:min(86vw,380px);height:auto;overflow:visible;filter:drop-shadow(0 14px 18px #8b5cf633);animation:sube 1s .25s cubic-bezier(.2,1.4,.4,1) both}
.llama{transform-box:fill-box;transform-origin:50% 100%;animation:parpadeo .45s ease-in-out infinite alternate;cursor:pointer}
.llama.off{animation:none;opacity:0;transform:scale(.2);transition:.45s;pointer-events:none}

/* Globos */
.globo{position:fixed;bottom:-16vh;left:var(--x);width:clamp(46px,8vw,78px);aspect-ratio:.82;border-radius:50% 50% 48% 48%;background:var(--c);opacity:.8;z-index:1;pointer-events:none;animation:vuela var(--d) linear var(--r) infinite}
.globo::after{content:"";position:absolute;left:50%;top:98%;width:2px;height:70px;background:#ffffffaa}

/* Página oculta */
.polaroid{background:#fff;padding:.8rem .8rem 1rem;border-radius:6px;box-shadow:0 16px 40px #6b21a855;transform:rotate(-2deg);max-width:min(92vw,520px)}
.polaroid img{display:block;max-width:100%;max-height:60svh;margin:0 auto;border-radius:3px}
.polaroid figcaption{font-family:Pacifico,cursive;color:var(--rosa-osc);margin-top:.7rem;font-size:1.15rem}
#aviso{max-width:38ch;line-height:1.5}

/* Entrada */
#entrada{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;padding:1rem;text-align:center;background:linear-gradient(160deg,#ffe3ef,#eadfff 55%,#d9f1ff);transition:opacity .5s,visibility .5s}
#entrada.fuera{opacity:0;visibility:hidden}
#entrada .regalo{font-size:6rem;animation:salta 1.1s ease-in-out infinite}
#entrada p{font-family:Pacifico,cursive;font-size:clamp(1.5rem,6vw,2.2rem);color:var(--rosa-osc)}
#musica{position:fixed;top:max(.8rem,env(safe-area-inset-top));right:.8rem;z-index:5;width:2.8rem;height:2.8rem;padding:0;font-size:1.3rem}
#confeti{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}

@keyframes cae{from{opacity:0;transform:translateY(-40px)}}
@keyframes sube{from{opacity:0;transform:translateY(60px) scale(.8)}}
@keyframes parpadeo{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.92,1.08) rotate(2deg)}}
@keyframes vuela{to{transform:translateY(-135vh) rotate(8deg)}}
@keyframes salta{50%{transform:translateY(-14px) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){
  .globo,#entrada .regalo,.llama{animation:none}
  h1,#tarta{animation-duration:.01s}
}
</style>
</head>
<body>

<div class="globo" style="--c:#ff7eb6;--x:4%;--d:17s;--r:-3s"></div>
<div class="globo" style="--c:#ffd166;--x:18%;--d:21s;--r:-12s"></div>
<div class="globo" style="--c:#8b5cf6;--x:33%;--d:19s;--r:-8s"></div>
<div class="globo" style="--c:#4cc9f0;--x:56%;--d:23s;--r:-16s"></div>
<div class="globo" style="--c:#06d6a0;--x:72%;--d:18s;--r:-5s"></div>
<div class="globo" style="--c:#ff9f1c;--x:86%;--d:22s;--r:-11s"></div>
<div class="globo" style="--c:#ff7eb6;--x:94%;--d:20s;--r:-1s"></div>

<div id="entrada">
  <div class="regalo" aria-hidden="true">🎁</div>
  <p>Alba, tienes una sorpresa</p>
  <button class="btn" id="abrir">Abrir sorpresa</button>
</div>

<button class="btn suave" id="musica" aria-label="Volver a escuchar la canción" title="Volver a escuchar la canción">🎵</button>

<!-- Página 1: portada -->
<main id="portada" class="vista">
  <p class="sup">🎉 Hoy toca celebrar esos 25 🎉</p>
  <h1>¡Feliz cumpleaños, Alba!</h1>

  <svg id="tarta" viewBox="0 14 320 270" role="img" aria-label="Tarta de cumpleaños con tres velas encendidas">
    <ellipse cx="160" cy="262" rx="150" ry="15" fill="#fff" stroke="#e9d5ff" stroke-width="3"/>
    <rect x="30" y="190" width="260" height="70" rx="12" fill="#ff9ec1"/>
    <path id="g1" fill="#fff"/>
    <text x="160" y="241" text-anchor="middle" font-family="Pacifico,cursive" font-size="32" fill="#fff">Alba</text>
    <rect x="70" y="130" width="180" height="62" rx="10" fill="#c9a7ff"/>
    <path id="g2" fill="#fff"/>
    <text x="160" y="177" text-anchor="middle" font-size="22" fill="#fff">♥ ♥ ♥</text>
    <rect x="105" y="78" width="110" height="54" rx="9" fill="#ffd36e"/>
    <path id="g3" fill="#fff"/>
    <g id="velas"></g>
  </svg>

  <p id="pista">Sopla las velas… y descubre la jugosa sorpresa.</p>
  <button class="btn" id="soplar">💨 Soplar las velas</button>
</main>

<!-- Página 2: escondida -->
<main id="secreto" class="vista">
  <h2>¡Sorpresa, Alba!</h2>
  <figure class="polaroid" id="marco" hidden>
    <img id="foto" alt="Una foto sorpresa para Alba">
    <figcaption>Para ti, con todo el cariño</figcaption>
  </figure>
  <p id="aviso"></p>
  <div class="botones">
    <button class="btn" id="otra">Otra sorpresa</button>
    <button class="btn suave" id="volver">Volver a la fiesta</button>
  </div>
</main>

<canvas id="confeti" aria-hidden="true"></canvas>

<script>
/* ========= Configuración =========
   Si tu servidor no muestra el contenido de la carpeta, escribe aquí los
   nombres de tus fotos, por ejemplo: ["foto1.jpg", "alba.png"] */
const IMAGENES = ["foto1.jpg","foto2.jpg","foto3.jpg","foto4.jpg","foto5.jpg","foto6.jpg","foto7.png","foto8.jpg","foto9.jpg","foto10.jpg","foto11.png"];

const $ = s => document.querySelector(s);
const reducir = matchMedia('(prefers-reduced-motion: reduce)').matches;
let entrado = false, apagadas = 0;

/* ========= Tarta ========= */
const escalon = (x, y, w, r) => `M${x} ${y}h${w}v${r * .6}` + `a${r} ${r} 0 0 1 ${-2 * r} 0`.repeat(w / (2 * r)) + 'z';
$('#g1').setAttribute('d', escalon(30, 190, 260, 13));
$('#g2').setAttribute('d', escalon(70, 130, 180, 10));
$('#g3').setAttribute('d', escalon(105, 78, 110, 11));

const POS_VELAS = [135, 160, 185];
$('#velas').innerHTML = POS_VELAS.map(x => `
  <rect x="${x - 4}" y="52" width="8" height="26" rx="2" fill="#fff"/>
  <path d="M${x - 4} 59l8-4M${x - 4} 67l8-4M${x - 4} 75l8-4" stroke="#ff5d9e" stroke-width="3"/>
  <path d="M${x} 52v-5" stroke="#4a2342" stroke-width="1.5"/>
  <g transform="translate(${x} 45)"><g class="llama">
    <path d="M0-17C7-8 7-1 0 3C-7-1-7-8 0-17Z" fill="#ffb703"/>
    <path d="M0-9C3-5 3-2 0 1C-3-2-3-5 0-9Z" fill="#fff3b0"/>
    <circle r="16" cy="-6" fill="#fff" fill-opacity="0"/>
  </g></g>`).join('');

function apagar(llama) {
  if (llama.classList.contains('off')) return;
  llama.classList.add('off');
  if (++apagadas === POS_VELAS.length) {
    $('#pista').textContent = '¡Pide un deseo! ✨';
    canones();
    setTimeout(() => { location.hash = 'secreto'; }, 1800);
  }
}
document.querySelectorAll('.llama').forEach(l => l.addEventListener('click', () => apagar(l)));
$('#soplar').addEventListener('click', () => document.querySelectorAll('.llama').forEach((l, i) => setTimeout(() => apagar(l), i * 180)));

function encender() {
  document.querySelectorAll('.llama').forEach(l => l.classList.remove('off'));
  apagadas = 0;
  $('#pista').textContent = 'Toca las llamitas para soplar las velas… y descubre la sorpresa escondida.';
}

/* ========= Confeti ========= */
const cv = $('#confeti'), cx = cv.getContext('2d');
const COLORES = ['#ff5d9e', '#ffd166', '#8b5cf6', '#4cc9f0', '#06d6a0', '#ff9f1c', '#ffffff'];
let W, H, piezas = [], lluvia = false;
const rnd = (a, b) => a + Math.random() * (b - a);

function ajustar() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d;
  cx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', ajustar); ajustar();

function pieza(x, y, vx, vy) {
  piezas.push({ x, y, vx, vy, w: rnd(6, 11), h: rnd(4, 8), r: rnd(0, 6.28), vr: rnd(-.3, .3), f: rnd(0, 6.28),
    c: COLORES[Math.random() * COLORES.length | 0], redonda: Math.random() < .25 });
}
function explosion(x, y, n, ang, abre) {
  n = reducir ? n / 3 : n;
  for (let i = 0; i < n; i++) {
    const a = ang + rnd(-abre / 2, abre / 2), v = rnd(7, 18);
    pieza(x, y, Math.cos(a) * v, Math.sin(a) * v);
  }
}
function canones() {
  explosion(0, H, 90, -Math.PI / 4, 1);
  explosion(W, H, 90, -3 * Math.PI / 4, 1);
  explosion(W / 2, H * .45, 80, -Math.PI / 2, Math.PI * 2);
}
function cuadro() {
  cx.clearRect(0, 0, W, H);
  if (lluvia && Math.random() < (reducir ? .08 : .45)) pieza(rnd(0, W), -12, rnd(-1, 1), rnd(1, 3));
  piezas = piezas.filter(p => p.y < H + 20);
  for (const p of piezas) {
    p.vy += .18; p.vx *= .97; p.vy *= .97;
    p.x += p.vx; p.y += p.vy; p.r += p.vr; p.f += .12;
    cx.save();
    cx.translate(p.x, p.y); cx.rotate(p.r); cx.scale(1, Math.cos(p.f)); cx.fillStyle = p.c;
    if (p.redonda) { cx.beginPath(); cx.arc(0, 0, p.w / 2, 0, 6.28); cx.fill(); }
    else cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cx.restore();
  }
  requestAnimationFrame(cuadro);
}
cuadro();

/* ========= Cumpleaños feliz (sintetizada, sin archivos de audio) ========= */
const NOTAS = { G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };
const MELODIA = [
  ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2],
  ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
  ['G4', .75], ['G4', .25], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 1],
  ['F5', .75], ['F5', .25], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 3]
];
let ac, maestro;

function parar() {
  if (maestro) { maestro.disconnect(); maestro = null; }
}
function cantar() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ac = ac || new AC();
  if (ac.state === 'suspended') ac.resume();
  parar();
  maestro = ac.createGain();
  maestro.gain.value = .55;
  maestro.connect(ac.destination);
  const pulso = 60 / 108;
  let t = ac.currentTime + .1;
  for (const [nota, pulsos] of MELODIA) {
    const dur = pulsos * pulso, f = NOTAS[nota], cola = Math.max(dur * 1.5, .4);
    [[f, 'triangle', .5], [f * 2, 'sine', .14]].forEach(([fr, tipo, vol]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = tipo; o.frequency.value = fr;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + cola);
      o.connect(g); g.connect(maestro);
      o.start(t); o.stop(t + cola + .05);
    });
    t += dur;
  }
}
$('#musica').addEventListener('click', () => { cantar(); canones(); });

/* ========= Fotos de la carpeta imagenes ========= */
let lista = null, ultima = -1;
async function cargarLista() {
  if (lista) return lista;
  lista = IMAGENES.map(n => 'imagenes/' + encodeURIComponent(n));
  if (!lista.length) {
    try {
      const r = await fetch('imagenes/');
      if (!r.ok) throw 0;
      const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
      lista = [...doc.querySelectorAll('a[href]')]
        .map(a => a.getAttribute('href').split('?')[0])
        .filter(h => /\.(jpe?g|png|gif|webp|avif|svg)$/i.test(h))
        .map(h => 'imagenes/' + h.split('/').pop());
    } catch (e) { lista = []; }
  }
  return lista;
}
async function mostrarFoto() {
  const l = await cargarLista();
  if (!l.length) {
    $('#marco').hidden = true; $('#otra').hidden = true;
    $('#aviso').textContent = 'No encuentro fotos. Guárdalas en la carpeta «imagenes» y escribe sus nombres en la lista IMAGENES del código.';
    return;
  }
  let i;
  do { i = Math.random() * l.length | 0; } while (l.length > 1 && i === ultima);
  ultima = i;
  $('#aviso').textContent = '';
  $('#marco').hidden = false;
  $('#otra').hidden = l.length < 2;
  $('#foto').src = l[i];
}
$('#foto').addEventListener('error', () => {
  $('#marco').hidden = true;
  $('#aviso').textContent = 'No se pudo cargar la foto ' + decodeURIComponent($('#foto').getAttribute('src')) + '. Revisa que el nombre sea correcto.';
});
$('#otra').addEventListener('click', mostrarFoto);
$('#volver').addEventListener('click', () => { location.hash = ''; });

/* ========= Navegación entre las dos páginas ========= */
function vista() {
  if (!entrado) return;
  const secreta = location.hash === '#secreto';
  if (!secreta && apagadas === POS_VELAS.length) encender();
  $('#portada').classList.toggle('on', !secreta);
  $('#secreto').classList.toggle('on', secreta);
  lluvia = !secreta;
  $('#musica').hidden = secreta;
  if (secreta) { mostrarFoto(); canones(); }
}
addEventListener('hashchange', vista);

$('#abrir').addEventListener('click', () => {
  entrado = true;
  $('#entrada').classList.add('fuera');
  cantar();
  vista();
  canones();
  setTimeout(() => { if (lluvia) canones(); }, 1400);
});
</script>
</body>
</html>
